<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Absensi Online</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 25px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 26px;
        }
        
        h1 span {
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .role-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .role-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 16px;
        }
        
        .role-btn.active {
            background: #667eea;
            color: white;
        }
        
        .role-btn:active {
            transform: scale(0.95);
        }
        
        .scanner-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        
        #scanner {
            width: 100%;
            height: 100%;
            background: #1a1a1a;
        }
        
        .scanner-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            height: 70%;
            border: 3px solid rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            pointer-events: none;
        }
        
        .scanner-overlay::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            width: 30px;
            height: 30px;
            border-top: 4px solid #00ff88;
            border-left: 4px solid #00ff88;
        }
        
        .scanner-overlay::after {
            content: '';
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 30px;
            height: 30px;
            border-bottom: 4px solid #00ff88;
            border-right: 4px solid #00ff88;
        }
        
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00ff88, transparent);
            animation: scan 2s linear infinite;
        }
        
        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }
        
        .status-text {
            text-align: center;
            color: #666;
            margin: 10px 0;
            font-size: 14px;
            min-height: 24px;
        }
        
        .status-text .loading {
            color: #667eea;
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .result-box {
            margin-top: 15px;
            padding: 20px;
            border-radius: 10px;
            background: #f8f9fa;
            display: none;
        }
        
        .result-box.show {
            display: block;
            animation: slideUp 0.5s ease;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .result-box.success {
            background: #d4edda;
            border: 2px solid #28a745;
        }
        
        .result-box.error {
            background: #f8d7da;
            border: 2px solid #dc3545;
        }
        
        .result-box h3 {
            margin-bottom: 10px;
            color: #333;
            font-size: 18px;
        }
        
        .result-box .info-item {
            padding: 8px 0;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        
        .result-box .info-item:last-child {
            border-bottom: none;
        }
        
        .result-box .label {
            font-weight: bold;
            color: #666;
            font-size: 14px;
        }
        
        .result-box .value {
            color: #333;
            font-size: 14px;
            word-break: break-all;
        }
        
        .btn-absen {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 15px;
        }
        
        .btn-absen:active {
            transform: scale(0.97);
        }
        
        .btn-absen:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .manual-input {
            margin-top: 15px;
            padding: 15px;
            background: #f1f3f5;
            border-radius: 10px;
        }
        
        .manual-input h4 {
            margin-bottom: 10px;
            color: #666;
            font-size: 14px;
        }
        
        .manual-input input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 10px;
        }
        
        .manual-input input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .manual-input button {
            width: 100%;
            padding: 12px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .manual-input button:active {
            transform: scale(0.97);
        }
        
        .debug-info {
            margin-top: 15px;
            padding: 10px;
            background: #fff3cd;
            border-radius: 8px;
            font-size: 12px;
            color: #856404;
            display: none;
            word-break: break-all;
            max-height: 150px;
            overflow-y: auto;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }
            h1 {
                font-size: 22px;
            }
            .role-btn {
                font-size: 14px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <h1>📋 <span>Absensi Online</span></h1>
        
        <div class="role-selector">
            <button class="role-btn active" data-role="siswa" onclick="setRole('siswa')">🎓 Siswa</button>
            <button class="role-btn" data-role="guru" onclick="setRole('guru')">👨‍🏫 Guru</button>
        </div>
        
        <div class="scanner-container">
            <div id="scanner"></div>
            <div class="scanner-overlay"></div>
            <div class="scan-line"></div>
        </div>
        
        <p class="status-text" id="statusText">🔄 Menyiapkan...</p>
        
        <div class="result-box" id="resultBox">
            <h3 id="resultTitle">✅ Data Ditemukan</h3>
            <div id="resultContent"></div>
            <button class="btn-absen" id="btnAbsen" onclick="prosesAbsen()">
                ✅ Absen Sekarang
            </button>
        </div>
        
        <div class="manual-input">
            <h4>⌨️ Input Manual</h4>
            <input type="text" id="manualCode" placeholder="Masukkan NISN/NIP..." maxlength="18">
            <button onclick="cekManual()">🔍 Cek Data</button>
        </div>
        
        <div class="debug-info" id="debugInfo"></div>
    </div>

    <script>
        // ==================== KONFIGURASI ====================
        // Ganti dengan URL Web App Anda
        const API_URL = 'https://script.google.com/macros/s/AKfycby70_xFztDlGOiJdhyY8B2P8jSvoXd8IeTkcnjWl6oAs3U5ZmI4FLjvjw8TywHMF-NTIQ/exec';
        
        // ==================== VARIABEL GLOBAL ====================
        let currentRole = 'siswa';
        let scannedData = null;
        let isScanning = false;
        let lastScannedCode = '';
        let scanTimeout = null;
        let quaggaInitialized = false;
        
        // ==================== DEBUG ====================
        function debugLog(message, data = null) {
            console.log('[DEBUG]', message, data);
            const debugEl = document.getElementById('debugInfo');
            if (debugEl) {
                debugEl.style.display = 'block';
                const timestamp = new Date().toLocaleTimeString();
                const logMessage = data ? `${message}: ${JSON.stringify(data)}` : message;
                debugEl.innerHTML += `<div>[${timestamp}] ${logMessage}</div>`;
                debugEl.scrollTop = debugEl.scrollHeight;
            }
        }
        
        // ==================== SET ROLE ====================
        function setRole(role) {
            debugLog('Set role:', role);
            currentRole = role;
            
            document.querySelectorAll('.role-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.role === role);
            });
            
            scannedData = null;
            document.getElementById('resultBox').classList.remove('show');
            document.getElementById('manualCode').value = '';
            lastScannedCode = '';
            
            if (isScanning) {
                stopScanner();
                setTimeout(() => startScanner(), 500);
            }
        }
        
        // ==================== START SCANNER ====================
        function startScanner() {
            debugLog('Starting scanner...');
            
            if (quaggaInitialized) {
                debugLog('Scanner already initialized, stopping first');
                stopScanner();
            }
            
            isScanning = true;
            document.getElementById('statusText').innerHTML = '📷 Menyiapkan kamera...';
            
            // Cek dukungan kamera
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                document.getElementById('statusText').innerHTML = '❌ Browser tidak mendukung kamera';
                debugLog('Browser tidak mendukung getUserMedia');
                return;
            }
            
            const targetElement = document.querySelector('#scanner');
            if (!targetElement) {
                debugLog('Element #scanner tidak ditemukan');
                return;
            }
            
            try {
                Quagga.init({
                    inputStream: {
                        name: "Live",
                        type: "LiveStream",
                        target: targetElement,
                        constraints: {
                            facingMode: "environment",
                            width: { ideal: 640 },
                            height: { ideal: 480 }
                        }
                    },
                    decoder: {
                        readers: [
                            "code_128_reader",
                            "ean_reader",
                            "ean_8_reader",
                            "code_39_reader",
                            "code_93_reader",
                            "codabar_reader",
                            "upc_reader",
                            "upc_e_reader",
                            "i2of5_reader",
                            "2of5_reader"
                        ]
                    },
                    locate: {
                        patchSize: "medium",
                        halfSample: true
                    }
                }, function(err) {
                    if (err) {
                        debugLog('Quagga init error:', err);
                        document.getElementById('statusText').innerHTML = '❌ Gagal akses kamera: ' + err.message;
                        isScanning = false;
                        return;
                    }
                    
                    debugLog('Quagga initialized successfully');
                    quaggaInitialized = true;
                    Quagga.start();
                    document.getElementById('statusText').innerHTML = '📸 Arahkan kamera ke barcode';
                    debugLog('Scanner started');
                });
                
                // Event handler untuk deteksi
                Quagga.onDetected(function(data) {
                    debugLog('Barcode detected:', data);
                    const rawCode = data.codeResult.code;
                    debugLog('Raw code:', rawCode);
                    
                    const processedCode = processBarcodeCode(rawCode);
                    debugLog('Processed code:', processedCode);
                    
                    if (processedCode === lastScannedCode) {
                        debugLog('Duplicate scan ignored');
                        return;
                    }
                    
                    lastScannedCode = processedCode;
                    
                    if (scanTimeout) {
                        clearTimeout(scanTimeout);
                    }
                    
                    handleBarcodeDetected(processedCode);
                    
                    scanTimeout = setTimeout(() => {
                        lastScannedCode = '';
                    }, 3000);
                });
                
                // Error handler
                Quagga.onProcessed(function(result) {
                    // Optional: handle processing
                });
                
            } catch (error) {
                debugLog('Error starting scanner:', error);
                document.getElementById('statusText').innerHTML = '❌ Error: ' + error.message;
                isScanning = false;
            }
        }
        
        // ==================== PROSES BARCODE ====================
        function processBarcodeCode(rawCode) {
            if (!rawCode) return '';
            
            // Hapus karakter non-digit
            let cleanCode = rawCode.replace(/\D/g, '');
            debugLog('Clean code:', cleanCode);
            
            const expectedLength = currentRole === 'siswa' ? 10 : 18;
            
            // Jika panjang kurang, tambahkan leading zeros
            if (cleanCode.length < expectedLength) {
                const missingZeros = expectedLength - cleanCode.length;
                cleanCode = '0'.repeat(missingZeros) + cleanCode;
                debugLog('Added leading zeros:', cleanCode);
            }
            
            // Jika terlalu panjang, ambil dari belakang
            if (cleanCode.length > expectedLength) {
                cleanCode = cleanCode.slice(-expectedLength);
                debugLog('Trimmed to length:', cleanCode);
            }
            
            return cleanCode;
        }
        
        // ==================== STOP SCANNER ====================
        function stopScanner() {
            debugLog('Stopping scanner...');
            isScanning = false;
            try {
                if (quaggaInitialized) {
                    Quagga.stop();
                    Quagga.offDetected();
                    quaggaInitialized = false;
                }
            } catch (e) {
                debugLog('Error stopping scanner:', e);
            }
        }
        
        // ==================== HANDLE BARCODE ====================
        function handleBarcodeDetected(code) {
            debugLog('Handle barcode:', code);
            
            // Pause scanner
            try {
                Quagga.pause();
            } catch (e) {
                debugLog('Error pausing scanner:', e);
            }
            
            // Validasi
            if (currentRole === 'siswa') {
                if (code.length !== 10) {
                    showResult(false, '❌ NISN harus 10 digit', 
                        `Panjang: ${code.length} digit\nKode: ${code}`);
                    document.getElementById('statusText').innerHTML = '❌ NISN harus 10 digit';
                    setTimeout(() => {
                        if (isScanning) {
                            try { Quagga.resume(); } catch(e) {}
                        }
                    }, 2500);
                    return;
                }
                
                if (!/^\d{10}$/.test(code)) {
                    showResult(false, '❌ NISN harus angka', 
                        `Format tidak valid: ${code}`);
                    document.getElementById('statusText').innerHTML = '❌ Format NISN tidak valid';
                    setTimeout(() => {
                        if (isScanning) {
                            try { Quagga.resume(); } catch(e) {}
                        }
                    }, 2500);
                    return;
                }
            } else {
                if (code.length !== 18) {
                    showResult(false, '❌ NIP harus 18 digit', 
                        `Panjang: ${code.length} digit\nKode: ${code}`);
                    document.getElementById('statusText').innerHTML = '❌ NIP harus 18 digit';
                    setTimeout(() => {
                        if (isScanning) {
                            try { Quagga.resume(); } catch(e) {}
                        }
                    }, 2500);
                    return;
                }
                
                if (!/^\d{18}$/.test(code)) {
                    showResult(false, '❌ NIP harus angka', 
                        `Format tidak valid: ${code}`);
                    document.getElementById('statusText').innerHTML = '❌ Format NIP tidak valid';
                    setTimeout(() => {
                        if (isScanning) {
                            try { Quagga.resume(); } catch(e) {}
                        }
                    }, 2500);
                    return;
                }
            }
            
            document.getElementById('statusText').innerHTML = `📌 Kode: ${code}`;
            cekData(code);
            
            setTimeout(() => {
                if (isScanning) {
                    try { Quagga.resume(); } catch(e) {}
                }
            }, 3000);
        }
        
        // ==================== CEK DATA ====================
        function cekData(code) {
            debugLog('Cek data:', code);
            document.getElementById('statusText').innerHTML = '⏳ Memeriksa data...';
            
            const endpoint = currentRole === 'siswa' ? 'cekSiswa' : 'cekGuru';
            const param = currentRole === 'siswa' ? 'nisn' : 'nip';
            
            const url = `${API_URL}?action=${endpoint}&${param}=${encodeURIComponent(code)}`;
            debugLog('Fetching URL:', url);
            
            fetch(url)
                .then(response => {
                    debugLog('Response status:', response.status);
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    debugLog('Response data:', data);
                    
                    if (data.status === 'found') {
                        scannedData = { code: code, data: data };
                        showResult(true, '✅ Data Ditemukan', data);
                        document.getElementById('statusText').innerHTML = '✅ Siap absen';
                    } else {
                        showResult(false, '❌ Data Tidak Ditemukan', 
                            data.message || 'Tidak terdaftar di database');
                        document.getElementById('statusText').innerHTML = '❌ Data tidak ditemukan';
                        scannedData = null;
                    }
                })
                .catch(error => {
                    debugLog('Fetch error:', error);
                    showResult(false, '❌ Error Koneksi', 
                        'Gagal terhubung ke server.\nPeriksa koneksi internet dan URL API.');
                    document.getElementById('statusText').innerHTML = '❌ Error koneksi';
                    scannedData = null;
                });
        }
        
        // ==================== SHOW RESULT ====================
        function showResult(success, title, content) {
            debugLog('Show result:', { success, title, content });
            
            const box = document.getElementById('resultBox');
            const titleEl = document.getElementById('resultTitle');
            const contentEl = document.getElementById('resultContent');
            
            box.className = 'result-box show ' + (success ? 'success' : 'error');
            titleEl.textContent = title;
            
            if (success && content.data) {
                const data = content.data;
                let html = '';
                const displayFields = ['nisn', 'nip', 'nama', 'kelas', 'jurusan', 'mapel'];
                for (const [key, value] of Object.entries(data)) {
                    if (key !== 'status' && displayFields.includes(key)) {
                        const label = key.toUpperCase();
                        html += `<div class="info-item">
                            <span class="label">${label}</span>
                            <span class="value">${value}</span>
                        </div>`;
                    }
                }
                contentEl.innerHTML = html;
                document.getElementById('btnAbsen').style.display = 'block';
            } else {
                const message = typeof content === 'string' ? content : JSON.stringify(content);
                contentEl.innerHTML = `<p style="color:#666; text-align:center; white-space:pre-line;">${message}</p>`;
                document.getElementById('btnAbsen').style.display = 'none';
            }
        }
        
        // ==================== PROSES ABSEN ====================
        function prosesAbsen() {
            if (!scannedData) {
                alert('Silakan scan barcode terlebih dahulu!');
                return;
            }
            
            const btn = document.getElementById('btnAbsen');
            btn.disabled = true;
            btn.textContent = '⏳ Memproses...';
            
            const endpoint = currentRole === 'siswa' ? 'absenSiswa' : 'absenGuru';
            const param = currentRole === 'siswa' ? 'nisn' : 'nip';
            const code = scannedData.code;
            
            const url = `${API_URL}?action=${endpoint}&${param}=${encodeURIComponent(code)}`;
            debugLog('Absen URL:', url);
            
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    debugLog('Absen response:', data);
                    
                    if (data.status === 'success') {
                        showResult(true, '✅ Absen Berhasil!', {
                            data: {
                                'Status': 'Hadir',
                                'Waktu': data.data.waktu || new Date().toLocaleString(),
                                'Nama': data.data.nama || scannedData.data.nama
                            }
                        });
                        document.getElementById('statusText').innerHTML = '✅ Absen berhasil!';
                        scannedData = null;
                        
                        btn.disabled = false;
                        btn.textContent = '✅ Absen Sekarang';
                        
                        setTimeout(() => {
                            document.getElementById('btnAbsen').style.display = 'none';
                        }, 3000);
                    } else {
                        showResult(false, '❌ Gagal Absen', data.message);
                        document.getElementById('statusText').innerHTML = '❌ ' + data.message;
                        btn.disabled = false;
                        btn.textContent = '✅ Absen Sekarang';
                    }
                })
                .catch(error => {
                    debugLog('Absen error:', error);
                    showResult(false, '❌ Error Koneksi', 
                        'Gagal terhubung ke server.\nPeriksa koneksi internet.');
                    document.getElementById('statusText').innerHTML = '❌ Error koneksi';
                    btn.disabled = false;
                    btn.textContent = '✅ Absen Sekarang';
                });
        }
        
        // ==================== CEK MANUAL ====================
        function cekManual() {
            const code = document.getElementById('manualCode').value.trim();
            if (!code) {
                alert('Masukkan NISN/NIP terlebih dahulu!');
                return;
            }
            
            let cleanCode = code.replace(/\D/g, '');
            
            if (currentRole === 'siswa') {
                if (cleanCode.length !== 10) {
                    alert(`NISN harus 10 digit! (${cleanCode.length} digit)`);
                    return;
                }
            } else {
                if (cleanCode.length !== 18) {
                    alert(`NIP harus 18 digit! (${cleanCode.length} digit)`);
                    return;
                }
            }
            
            document.getElementById('statusText').innerHTML = `📌 Input: ${cleanCode}`;
            cekData(cleanCode);
        }
        
        // ==================== INIT ====================
        window.onload = function() {
            debugLog('=== APP STARTED ===');
            debugLog('API_URL:', API_URL);
            debugLog('Browser:', navigator.userAgent);
            
            // Set initial role
            setRole('siswa');
            
            // Cek dukungan kamera
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                debugLog('Camera supported');
            } else {
                debugLog('Camera NOT supported');
                document.getElementById('statusText').innerHTML = '❌ Browser tidak mendukung kamera';
            }
            
            // Start scanner after a short delay
            setTimeout(() => {
                startScanner();
            }, 1000);
            
            // Enter key untuk input manual
            document.getElementById('manualCode').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    cekManual();
                }
            });
            
            // Auto format input manual
            document.getElementById('manualCode').addEventListener('input', function(e) {
                this.value = this.value.replace(/\D/g, '');
            });
            
            debugLog('=== APP READY ===');
        };
        
        // Cleanup
        window.onbeforeunload = function() {
            stopScanner();
        };
        
        window.addEventListener('error', function(e) {
            debugLog('Global error:', e.message);
            document.getElementById('statusText').innerHTML = '❌ Error: ' + e.message;
        });
    </script>
</body>
</html>
