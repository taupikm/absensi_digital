<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Online QR Barcode</title>
    <!-- Tailwind CSS untuk Desain Modern -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <!-- Html5-qrcode Library untuk Scanner Kamera HP -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-gray-100 font-sans antialiased">
    <div class="container mx-auto max-w-lg p-4 mt-6">
        <div class="bg-white rounded-lg shadow-md p-6">
            <h1 class="text-2xl font-bold text-center text-blue-600 mb-6">Absensi QR Barcode</h1>
            
            <!-- Form Pengaturan Sesi & Identitas Scanner -->
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Pilih Sesi Absensi:</label>
                <select id="selectSesi" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
                    <option value="">Memuat Sesi...</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">ID / NIP Scanner (Guru / Admin):</label>
                <input type="password" id="inputScanner" placeholder="Masukkan PIN / NIP / Kode Admin" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
                <p class="text-xs text-gray-500 mt-1">Guru scan siswa | Admin scan guru & siswa</p>
            </div>

            <!-- Kamera Scanner Section -->
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Kamera Scanner QR:</label>
                <div id="reader" class="w-full rounded overflow-hidden border"></div>
            </div>

            <!-- Status Notifikasi -->
            <div id="notifikasi" class="hidden p-4 rounded text-center font-semibold mb-4"></div>
            
            <div class="text-center text-xs text-gray-400 mt-6">
                Sistem Absensi Dinamis Berbasis Google Apps Script
            </div>
        </div>
    </div>

    <script>
        let html5QrCode;
        let isProcessing = false;

        // Ambil data konfigurasi sesi dari Backend saat halaman dimuat
        window.onload = function() {
            google.script.run
                .withSuccessHandler(function(data) {
                    let select = document.getElementById('selectSesi');
                    select.innerHTML = '';
                    if(data.sesi && data.sesi.length > 0) {
                        data.sesi.forEach(function(sesi) {
                            let opt = document.createElement('option');
                            opt.value = sesi.namaSesi;
                            opt.textContent = `${sesi.namaSesi} (${sesi.mulaiTW} - ${sesi.tutup})`;
                            select.appendChild(opt);
                        });
                        initScanner();
                    } else {
                        select.innerHTML = '<option value="">Tidak ada sesi tersedia di Pengaturan</option>';
                    }
                })
                .withFailureHandler(function(err) {
                    alert("Gagal memuat sesi: " + err.message);
                })
                .getDatabase();
        };

        function initScanner() {
            html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 10, qrbox: { width: 250, height: 250 } };
            
            html5QrCode.start(
                { facingMode: "environment" }, 
                config, 
                onScanSuccess,
                onScanFailure
            ).catch(err => {
                console.error("Gagal membuka kamera:", err);
                showNotif("Gagal membuka kamera HP. Pastikan izin kamera diaktifkan.", "error");
            });
        }

        function onScanSuccess(decodedText, decodedResult) {
            if (isProcessing) return; // Cegah scan ganda secara cepat
            
            let scannerID = document.getElementById('inputScanner').value.trim();
            let selectedSesi = document.getElementById('selectSesi').value;

            if (!scannerID) {
                showNotif("Mohon isi ID/PIN Scanner (Guru/Admin) terlebih dahulu!", "error");
                return;
            }

            if (!selectedSesi) {
                showNotif("Pilih sesi absensi terlebih dahulu!", "error");
                return;
            }

            isProcessing = true;
            showNotif("Memproses QR Code: " + decodedText + "...", "info");

            // Kirim data ke Backend Google Apps Script
            google.script.run
                .withSuccessHandler(function(response) {
                    if (response.status === "success") {
                        showNotif(response.message, "success");
                    } else if (response.status === "warning") {
                        showNotif(response.message, "warning");
                    } else {
                        showNotif(response.message, "error");
                    }
                    setTimeout(() => { isProcessing = false; }, 3000); // Jeda 3 detik untuk scan berikutnya
                })
                .withFailureHandler(function(error) {
                    showNotif("Terjadi kesalahan sistem: " + error.message, "error");
                    isProcessing = false;
                })
                .prosesAbsensi(scannerID, decodedText, selectedSesi);
        }

        function onScanFailure(error) {
            // Error scan secara frame per frame (diabaikan agar tidak spam log)
        }

        function showNotif(message, type) {
            let notif = document.getElementById('notifikasi');
            notif.classList.remove('hidden', 'bg-green-100', 'text-green-700', 'bg-red-100', 'text-red-700', 'bg-yellow-100', 'text-yellow-750', 'bg-blue-100', 'text-blue-700');
            
            if (type === "success") {
                notif.classList.add('bg-green-100', 'text-green-700');
            } else if (type === "error") {
                notif.classList.add('bg-red-100', 'text-red-700');
            } else if (type === "warning") {
                notif.classList.add('bg-yellow-100', 'text-yellow-800');
            } else {
                notif.classList.add('bg-blue-100', 'text-blue-700');
            }
            
            notif.innerText = message;
            notif.classList.remove('hidden');
        }
    </script>
</body>
</html>
