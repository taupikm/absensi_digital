<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Absensi QR Code</title>
    
    <!-- Include QR Scanner Library -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }
        
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        input:focus, select:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-danger {
            background: #ff6b6b;
            color: white;
        }
        
        .btn-danger:hover {
            background: #ee5a24;
        }
        
        .btn-success {
            background: #00b894;
            color: white;
        }
        
        .btn-success:hover {
            background: #00a381;
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
        }
        
        .btn-sm {
            padding: 8px 15px;
            font-size: 14px;
            width: auto;
            margin: 5px;
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .btn-group .btn {
            flex: 1;
            min-width: 100px;
        }
        
        .video-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 20px auto;
            border-radius: 15px;
            overflow: hidden;
            background: #000;
        }
        
        video {
            width: 100%;
            height: auto;
            display: block;
        }
        
        #scanCanvas {
            display: none;
        }
        
        .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 3px solid #00ff00;
            width: 250px;
            height: 250px;
            border-radius: 20px;
            box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.3);
            pointer-events: none;
        }
        
        .result-box {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            border-left: 4px solid #667eea;
        }
        
        .result-box.success {
            border-left-color: #00b894;
        }
        
        .result-box.error {
            border-left-color: #ff6b6b;
        }
        
        .result-box h3 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .status-badge.tw {
            background: #00b894;
            color: white;
        }
        
        .status-badge.tl {
            background: #fdcb6e;
            color: #333;
        }
        
        .status-badge.alpa {
            background: #ff6b6b;
            color: white;
        }
        
        .status-badge.bolos {
            background: #e17055;
            color: white;
        }
        
        .hidden {
            display: none !important;
        }
        
        .sesi-list {
            margin: 20px 0;
        }
        
        .sesi-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .sesi-item .sesi-info {
            flex: 1;
        }
        
        .sesi-item .sesi-info strong {
            display: block;
            font-size: 16px;
            color: #333;
        }
        
        .sesi-item .sesi-info span {
            font-size: 14px;
            color: #666;
        }
        
        .role-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .role-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }
        
        .role-btn.active {
            border-color: #667eea;
            background: #f0f3ff;
            color: #667eea;
        }
        
        .role-btn:hover {
            border-color: #667eea;
        }
        
        .admin-panel {
            background: #fff3cd;
            border-radius: 10px;
            padding: 15px;
            margin: 15px 0;
        }
        
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            z-index: 1000;
            animation: slideUp 0.3s ease;
            max-width: 90%;
            text-align: center;
        }
        
        .toast-success {
            background: #00b894;
        }
        
        .toast-error {
            background: #ff6b6b;
        }
        
        @keyframes slideUp {
            from {
                transform: translateX(-50%) translateY(100px);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }
        
        .tab.active {
            border-bottom-color: #667eea;
            color: #667eea;
            font-weight: 600;
        }
        
        .tab:hover {
            border-bottom-color: #667eea;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }
            
            .btn-group .btn {
                min-width: 80px;
                font-size: 12px;
                padding: 10px;
            }
            
            .sesi-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <h1>📱 Absensi QR Code</h1>
        
        <!-- Login Form -->
        <div id="loginForm">
            <div class="role-selector">
                <div class="role-btn active" data-role="siswa" onclick="setRole('siswa')">Siswa</div>
                <div class="role-btn" data-role="guru" onclick="setRole('guru')">Guru</div>
                <div class="role-btn" data-role="admin" onclick="setRole('admin')">Admin</div>
            </div>
            
            <div class="form-group">
                <label for="loginId">ID / NISN / NIP</label>
                <input type="text" id="loginId" placeholder="Masukkan ID/NISN/NIP">
            </div>
            
            <div class="form-group" id="pinGroup">
                <label for="loginPin">PIN</label>
                <input type="password" id="loginPin" placeholder="Masukkan PIN">
            </div>
            
            <button class="btn btn-primary" onclick="login()">Login</button>
        </div>
        
        <!-- Main App -->
        <div id="mainApp" class="hidden">
            <div id="userInfo" style="margin-bottom: 15px; padding: 10px; background: #f8f9fa; border-radius: 10px;">
                <strong>👤 <span id="userName"></span></strong>
                <span style="float: right;">
                    <button class="btn btn-sm btn-secondary" onclick="logout()">Logout</button>
                </span>
            </div>
            
            <div class="tabs">
                <div class="tab active" onclick="switchTab('scan')">Scan QR</div>
                <div class="tab" onclick="switchTab('sesi')">Sesi</div>
                <div class="tab" onclick="switchTab('admin')" id="adminTab">Admin</div>
            </div>
            
            <!-- Scan Tab -->
            <div class="tab-content active" id="tabScan">
                <div class="form-group">
                    <label for="scanSesi">Pilih Sesi</label>
                    <select id="scanSesi">
                        <option value="">-- Pilih Sesi --</option>
                    </select>
                </div>
                
                <div class="video-container">
                    <video id="video" playsinline></video>
                    <div class="overlay" id="scanOverlay"></div>
                </div>
                
                <div class="btn-group">
                    <button class="btn btn-success" onclick="startScanner()">📷 Buka Kamera</button>
                    <button class="btn btn-danger" onclick="stopScanner()">✖ Tutup Kamera</button>
                </div>
                
                <div id="scanResult" class="result-box hidden">
                    <h3 id="resultTitle">Hasil Scan</h3>
                    <p id="resultMessage"></p>
                </div>
            </div>
            
            <!-- Sesi Tab -->
            <div class="tab-content" id="tabSesi">
                <div id="sesiList" class="sesi-list">
                    <!-- Sesi akan dimuat di sini -->
                </div>
                
                <div id="addSesiForm" class="admin-panel">
                    <h4>Tambah Sesi Baru</h4>
                    <div class="form-group">
                        <label>Nama Sesi</label>
                        <input type="text" id="newSesiName" placeholder="Contoh: Sesi 4">
                    </div>
                    <div class="form-group">
                        <label>Jam Mulai</label>
                        <input type="time" id="newSesiMulai">
                    </div>
                    <div class="form-group">
                        <label>Batas Tepat Waktu</label>
                        <input type="time" id="newSesiBatas">
                    </div>
                    <div class="form-group">
                        <label>Jam Tutup</label>
                        <input type="time" id="newSesiTutup">
                    </div>
                    <button class="btn btn-primary" onclick="addSesi()">Tambah Sesi</button>
                </div>
            </div>
            
            <!-- Admin Tab -->
            <div class="tab-content" id="tabAdmin">
                <div id="adminPanel" class="hidden">
                    <h3>Panel Admin</h3>
                    <div class="admin-panel">
                        <h4>Scan Barcode Guru/Siswa</h4>
                        <p class="text-muted">Gunakan kamera untuk scan barcode</p>
                    </div>
                    
                    <div id="adminResult" class="result-box hidden">
                        <h3 id="adminResultTitle">Hasil</h3>
                        <p id="adminResultMessage"></p>
                    </div>
                </div>
                
                <div id="adminOnlyMessage" class="admin-panel">
                    <p>⚠️ Hanya admin yang dapat mengakses panel ini</p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Toast Container -->
    <div id="toastContainer"></div>
    
    <script>
        // Global Variables
        let currentRole = 'siswa';
        let currentUser = null;
        let videoStream = null;
        let scanInterval = null;
        let isScanning = false;
        let currentSesi = '';
        
        // ============================================
        // Google Apps Script Functions
        // ============================================
        function login() {
            const id = document.getElementById('loginId').value.trim();
            const pin = document.getElementById('loginPin').value.trim();
            
            if (!id) {
                showToast('Mohon masukkan ID', 'error');
                return;
            }
            
            if (currentRole !== 'siswa' && !pin) {
                showToast('Mohon masukkan PIN', 'error');
                return;
            }
            
            if (currentRole === 'siswa' && id.length !== 10) {
                showToast('NISN harus 10 digit', 'error');
                return;
            }
            
            showToast('Sedang memproses...', 'success');
            
            google.script.run
                .withSuccessHandler(function(response) {
                    if (response.success) {
                        currentUser = response;
                        document.getElementById('userName').textContent = response.nama + ' (' + response.role + ')';
                        document.getElementById('loginForm').classList.add('hidden');
                        document.getElementById('mainApp').classList.remove('hidden');
                        
                        if (response.role === 'admin') {
                            document.getElementById('adminTab').classList.remove('hidden');
                            document.getElementById('adminPanel').classList.remove('hidden');
                            document.getElementById('adminOnlyMessage').classList.add('hidden');
                        } else {
                            document.getElementById('adminTab').classList.add('hidden');
                        }
                        
                        loadSesi();
                        showToast('Login berhasil! Selamat datang ' + response.nama, 'success');
                    } else {
                        showToast('Login gagal: ' + response.message, 'error');
                    }
                })
                .withFailureHandler(function(error) {
                    showToast('Terjadi kesalahan: ' + error.message, 'error');
                })
                .doLogin(id, pin, currentRole);
        }
        
        function logout() {
            stopScanner();
            currentUser = null;
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('mainApp').classList.add('hidden');
            showToast('Logout berhasil', 'success');
        }
        
        function setRole(role) {
            currentRole = role;
            document.querySelectorAll('.role-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`.role-btn[data-role="${role}"]`).classList.add('active');
            
            // Show/hide PIN field
            const pinGroup = document.getElementById('pinGroup');
            if (role === 'siswa') {
                pinGroup.classList.add('hidden');
                document.getElementById('loginPin').required = false;
                document.getElementById('loginId').placeholder = 'Masukkan NISN (10 digit)';
            } else {
                pinGroup.classList.remove('hidden');
                document.getElementById('loginPin').required = true;
                if (role === 'guru') {
                    document.getElementById('loginId').placeholder = 'Masukkan NIP (18 digit)';
                } else {
                    document.getElementById('loginId').placeholder = 'Masukkan ID Admin';
                }
            }
        }
        
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            document.querySelector(`.tab[onclick*="${tab}"]`).classList.add('active');
            document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
            
            if (tab === 'scan') {
                // Load sesi for scan
                loadSesi();
            }
        }
        
        function loadSesi() {
            google.script.run
                .withSuccessHandler(function(sesiList) {
                    const select = document.getElementById('scanSesi');
                    select.innerHTML = '<option value="">-- Pilih Sesi --</option>';
                    
                    const sesiContainer = document.getElementById('sesiList');
                    sesiContainer.innerHTML = '';
                    
                    sesiList.forEach(sesi => {
                        // Add to select
                        const option = document.createElement('option');
                        option.value = sesi.sesi;
                        option.textContent = sesi.sesi + ' (' + sesi.mulai + ' - ' + sesi.tutup + ')';
                        select.appendChild(option);
                        
                        // Add to list
                        const div = document.createElement('div');
                        div.className = 'sesi-item';
                        div.innerHTML = `
                            <div class="sesi-info">
                                <strong>${sesi.sesi}</strong>
                                <span>Mulai: ${sesi.mulai} | Batas TW: ${sesi.batasTw} | Tutup: ${sesi.tutup}</span>
                            </div>
                            <div>
                                <button class="btn btn-sm btn-danger" onclick="deleteSesi('${sesi.sesi}')">Hapus</button>
                            </div>
                        `;
                        sesiContainer.appendChild(div);
                    });
                })
                .withFailureHandler(function(error) {
                    showToast('Gagal memuat sesi: ' + error.message, 'error');
                })
                .getSesiList();
        }
        
        function addSesi() {
            const nama = document.getElementById('newSesiName').value.trim();
            const mulai = document.getElementById('newSesiMulai').value;
            const batas = document.getElementById('newSesiBatas').value;
            const tutup = document.getElementById('newSesiTutup').value;
            
            if (!nama || !mulai || !batas || !tutup) {
                showToast('Semua field harus diisi', 'error');
                return;
            }
            
            google.script.run
                .withSuccessHandler(function(response) {
                    if (response.success) {
                        showToast(response.message, 'success');
                        loadSesi();
                        document.getElementById('newSesiName').value = '';
                        document.getElementById('newSesiMulai').value = '';
                        document.getElementById('newSesiBatas').value = '';
                        document.getElementById('newSesiTutup').value = '';
                    } else {
                        showToast(response.message, 'error');
                    }
                })
                .withFailureHandler(function(error) {
                    showToast('Gagal menambah sesi: ' + error.message, 'error');
                })
                .addSesi(nama, mulai, batas, tutup);
        }
        
        function deleteSesi(sesi) {
            if (!confirm('Yakin ingin menghapus sesi ' + sesi + '?')) return;
            
            google.script.run
                .withSuccessHandler(function(response) {
                    if (response.success) {
                        showToast(response.message, 'success');
                        loadSesi();
                    } else {
                        showToast(response.message, 'error');
                    }
                })
                .withFailureHandler(function(error) {
                    showToast('Gagal menghapus sesi: ' + error.message, 'error');
                })
                .deleteSesi(sesi);
        }
        
        // ============================================
        // QR Scanner Functions
        // ============================================
        function startScanner() {
            const sesi = document.getElementById('scanSesi').value;
            if (!sesi) {
                showToast('Pilih sesi terlebih dahulu', 'error');
                return;
            }
            currentSesi = sesi;
            
            if (isScanning) {
                showToast('Scanner sudah berjalan', 'info');
                return;
            }
            
            const video = document.getElementById('video');
            
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                })
                .then(function(stream) {
                    videoStream = stream;
                    video.srcObject = stream;
                    video.play();
                    isScanning = true;
                    showToast('Kamera aktif, scan QR Code', 'success');
                    scanInterval = setInterval(scanQR, 500);
                })
                .catch(function(err) {
                    showToast('Gagal mengakses kamera: ' + err.message, 'error');
                });
            } else {
                showToast('Browser tidak mendukung kamera', 'error');
            }
        }
        
        function stopScanner() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
            if (scanInterval) {
                clearInterval(scanInterval);
                scanInterval = null;
            }
            isScanning = false;
            document.getElementById('video').srcObject = null;
            showToast('Kamera ditutup', 'info');
        }
        
        function scanQR() {
            const video = document.getElementById('video');
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(imageData.data, imageData.width, imageData.height);
            
            if (code && code.data) {
                // Stop scanning
                stopScanner();
                
                // Process QR data
                processQR(code.data);
            }
        }
        
        function processQR(qrData) {
            // QR data format: ROLE|ID
            // Example: SISWA|1234567890 or GURU|123456789012345678
            const parts = qrData.split('|');
            if (parts.length !== 2) {
                showToast('QR Code tidak valid', 'error');
                return;
            }
            
            const role = parts[0].toLowerCase();
            const id = parts[1];
            
            if (role !== 'siswa' && role !== 'guru') {
                showToast('QR Code tidak valid', 'error');
                return;
            }
            
            // Validate based on current user role
            if (currentUser.role === 'guru' && role === 'guru') {
                showToast('Guru tidak bisa menscan guru lain', 'error');
                return;
            }
            
            if (currentUser.role === 'siswa') {
                showToast('Siswa tidak bisa melakukan absensi', 'error');
                return;
            }
            
            // Process absensi
            const tanggal = new Date().toISOString().split('T')[0];
            
            google.script.run
                .withSuccessHandler(function(response) {
                    if (response.success) {
                        const resultDiv = document.getElementById('scanResult');
