<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Absensi QR Code</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .card { background: #fff; width: 100%; max-width: 480px; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #333; margin-top: 0; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; }
    select, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; margin-bottom: 10px; }
    .btn-group { display: flex; gap: 10px; }
    .btn-role { flex: 1; background: #e0e0e0; border: none; cursor: pointer; font-weight: bold; }
    .btn-role.active { background: #007bff; color: white; }
    .btn-toggle { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
    .btn-toggle.off { background: #dc3545; }
    #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-top: 10px; min-height: 250px; background: #222; }
    #alert { margin-top: 15px; padding: 12px; border-radius: 8px; display: none; text-align: center; font-weight: bold; }
    .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .alert-warning { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
    .alert-danger { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>

<div class="card">
  <h2>Absensi Scanner</h2>

  <!-- Input Sesi -->
  <div class="form-group">
    <label for="sesiSelect">Pilih Sesi Absen:</label>
    <select id="sesiSelect">
      <option value="Sesi 1">Sesi 1 (Masuk Pagi)</option>
      <option value="Sesi 2">Sesi 2 (Siang/Kegiatan)</option>
      <option value="Sesi 3">Sesi 3 (Pulang)</option>
    </select>
  </div>

  <!-- Pilihan Peran -->
  <div class="form-group">
    <label>Pilih Peran:</label>
    <div class="btn-group">
      <button type="button" class="btn-role active" id="btnSiswa" onclick="selectRole('siswa')">Siswa</button>
      <button type="button" class="btn-role" id="btnGuru" onclick="selectRole('guru')">Guru</button>
    </div>
  </div>

  <!-- Kontrol Kamera -->
  <button id="btnCameraToggle" class="btn-toggle" onclick="toggleCamera()">Buka Kamera</button>
  <div id="reader"></div>

  <!-- Output Status -->
  <div id="alert"></div>
</div>

<script>
  // TEMPELKAN URL GOOGLE APPS SCRIPT ANDA DI SINI
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycby350UBibsLv1xCMz5chY6uh4ShvVaX9O7VS6mWT7YvCoGXrXzp5MLf-hHWPmm2KVa9/exec";

  let currentRole = 'siswa';
  let html5QrcodeScanner = null;
  let isCameraOn = false;
  let isProcessing = false;

  function selectRole(role) {
    currentRole = role;
    document.getElementById('btnSiswa').classList.toggle('active', role === 'siswa');
    document.getElementById('btnGuru').classList.toggle('active', role === 'guru');
  }

  function toggleCamera() {
    if (isCameraOn) {
      stopCamera();
    } else {
      startCamera();
    }
  }

  function startCamera() {
    html5QrcodeScanner = new Html5Qrcode("reader");
    const config = { fps: 10, qrbox: { width: 250, height: 250 } };

    html5QrcodeScanner.start(
      { facingMode: "environment" },
      config,
      onScanSuccess
    ).then(() => {
      isCameraOn = true;
      const btn = document.getElementById('btnCameraToggle');
      btn.innerText = "Tutup Kamera";
      btn.classList.add('off');
    }).catch(err => {
      showAlert("danger", "Gagal mengakses kamera: " + err);
    });
  }

  function stopCamera() {
    if (html5QrcodeScanner) {
      html5QrcodeScanner.stop().then(() => {
        html5QrcodeScanner.clear();
        isCameraOn = false;
        const btn = document.getElementById('btnCameraToggle');
        btn.innerText = "Buka Kamera";
        btn.classList.remove('off');
      }).catch(err => console.error(err));
    }
  }

  function onScanSuccess(decodedText) {
    if (isProcessing) return; // Mencegah multiple submit cepat
    isProcessing = true;

    const sesi = document.getElementById('sesiSelect').value;
    showAlert("warning", "Memproses absensi...");

    fetch(GAS_WEB_APP_URL, {
      method: "POST",
      mode: "no-cors", // Penting untuk bypass CORS Google Apps Script
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        role: currentRole,
        code: decodedText,
        sesi: sesi
      })
    })
    .then(() => {
      showAlert("success", `QR Code [${decodedText}] berhasil diproses!`);
      setTimeout(() => { isProcessing = false; }, 3000); // Debounce 3 detik
    })
    .catch(error => {
      showAlert("danger", "Terjadi kesalahan jaringan.");
      isProcessing = false;
    });
  }

  function showAlert(type, message) {
    const alertDiv = document.getElementById('alert');
    alertDiv.className = `alert-${type}`;
    alertDiv.innerText = message;
    alertDiv.style.display = 'block';
  }
</script>

</body>
</html>
