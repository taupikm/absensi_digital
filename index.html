<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi Online QR Code</title>
    <!-- Library QR Scanner (html5-qrcode) -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; }
        input, select, button { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        button { background: #007BFF; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #a71d2a; }
        .hidden { display: none; }
        #reader { width: 100%; margin-top: 10px; }
        .alert { padding: 10px; margin: 10px 0; border-radius: 5px; font-weight: bold; }
        .alert-success { background: #d4edda; color: #155724; }
        .alert-error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="container">
    <h2>Sistem Absensi Online</h2>

    <!-- FORM LOGIN SATU KOLOM -->
    <div id="login-section">
        <p>Masukkan NISN (Siswa), PIN (Guru), atau PIN (Admin):</p>
        <input type="password" id="credential" placeholder="Masukkan NISN / PIN" maxlength="18">
        <button onclick="login()">Masuk</button>
        <div id="login-alert"></div>
    </div>

    <!-- DASHBOARD UTAMA -->
    <div id="dashboard-section" class="hidden">
        <h3 id="user-info"></h3>
        <p id="date-info"></p>

        <div id="session-container">
            <label>Pilih Sesi Absensi:</label>
            <select id="select-sesi"></select>
        </div>

        <div id="scanner-controls" class="hidden">
            <button id="btn-toggle-cam" onclick="toggleCamera()">Buka Kamera Scanner</button>
            <div id="reader" class="hidden"></div>
        </div>

        <div id="scan-result"></div>
        <button class="btn-danger" onclick="logout()">Keluar</button>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzX_FQZvuGxCNc3ibDghYaMrZZGlzwo9VU-BHPTEVbcXRTYSOnGdFBsVxs3OpJEZU4h/exec"; // <-- Masukkan URL Web App Google Script Anda di sini
    let currentUser = null;
    let html5QrCode = null;
    let isCameraOpen = false;
    let appConfig = null;

    async function login() {
        const credential = document.getElementById("credential").value.trim();
        if (!credential) {
            showAlert("login-alert", "Kredensial tidak boleh kosong!", "error");
            return;
        }

        try {
            let response = await fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({ action: "login", credential: credential })
            });
            let result = await response.json();

            if (result.status === "success") {
                currentUser = result;
                initDashboard();
            } else {
                showAlert("login-alert", result.message, "error");
            }
        } catch (err) {
            showAlert("login-alert", "Gagal terhubung ke server.", "error");
        }
    }

    async function initDashboard() {
        document.getElementById("login-section").classList.add("hidden");
        document.getElementById("dashboard-section").classList.remove("hidden");
        document.getElementById("user-info").innerText = `Halo, ${currentUser.name} (${currentUser.role})`;

        // Ambil Pengaturan Sesi & Hari Libur dari Backend
        try {
            let response = await fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({ action: "get_config" })
            });
            let result = await response.json();

            if (result.status === "libur") {
                alert(result.message);
                logout();
                return;
            }

            if (result.status === "success") {
                appConfig = result;
                document.getElementById("date-info").innerText = `Tanggal: ${appConfig.date}`;
                
                let selectSesi = document.getElementById("select-sesi");
                selectSesi.innerHTML = "";
                appConfig.sessions.forEach(s => {
                    let opt = document.createElement("option");
                    opt.value = s.namaSesi;
                    opt.text = `${s.namaSesi} (Mulai: ${s.mulaiTW} - Tutup: ${s.tutupSesi})`;
                    selectSesi.appendChild(opt);
                });

                // Jika Admin atau Guru, tampilkan tombol buka/tutup kamera scanner
                if (currentUser.role === "Admin" || currentUser.role === "Guru") {
                    document.getElementById("scanner-controls").classList.remove("hidden");
                } else {
                    showAlert("scan-result", "Siswa menggunakan halaman ini hanya untuk verifikasi akun. Barcode Anda discan oleh Guru/Admin.", "error");
                }
            }
        } catch (err) {
            console.error(err);
        }
    }

    function toggleCamera() {
        if (!isCameraOpen) {
            startCamera();
        } else {
            stopCamera();
        }
    }

    function startCamera() {
        const readerDiv = document.getElementById("reader");
        readerDiv.classList.remove("hidden");
        document.getElementById("btn-toggle-cam").innerText = "Tutup Kamera Scanner";
        document.getElementById("btn-toggle-cam").className = "btn-danger";
        isCameraOpen = true;

        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: 250 },
            onScanSuccess
        ).catch(err => {
            alert("Tidak dapat mengakses kamera HP: " + err);
            stopCamera();
        });
    }

    function stopCamera() {
        if (html5QrCode && isCameraOpen) {
            html5QrCode.stop().then(() => {
                html5QrCode.clear();
                cleanupCameraUI();
            }).catch(err => {
                cleanupCameraUI();
            });
        } else {
            cleanupCameraUI();
        }
    }

    function cleanupCameraUI() {
        document.getElementById("reader").classList.add("hidden");
        document.getElementById("btn-toggle-cam").innerText = "Buka Kamera Scanner";
        document.getElementById("btn-toggle-cam").className = "";
        isCameraOpen = false;
    }

async function onScanSuccess(decodedText) {
    // Hentikan sementara scanner agar tidak terjadi multi-scan berturut-turut
    if (html5QrCode && isCameraOpen) {
        await html5QrCode.pause();
    }

    let selectedSesi = document.getElementById("select-sesi").value;

    let payload = {
        action: "scan",
        scannerRole: currentUser.role,
        scannerId: currentUser.id,
        scannedCode: decodedText.trim(),
        sesi: selectedSesi,
        tanggal: appConfig.date
    };

    try {
        let response = await fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify(payload)
        });
        let result = await response.json();

        if (result.status === "success") {
            showAlert("scan-result", result.message, "success");
        } else {
            showAlert("scan-result", result.message, "error");
        }
    } catch (err) {
        showAlert("scan-result", "Gagal mengirim data absen ke server.", "error");
    }

    // Kamera langsung di-resume kembali setelah 2.5 detik (menepati batas maksimal 3 detik)
    setTimeout(async () => {
        if (html5QrCode && isCameraOpen) {
            await html5QrCode.resume();
        }
    }, 2500);
}

    function logout() {
        if (isCameraOpen) stopCamera();
        currentUser = null;
        document.getElementById("credential").value = "";
        document.getElementById("dashboard-section").classList.add("hidden");
        document.getElementById("login-section").classList.remove("hidden");
        document.getElementById("scan-result").innerHTML = "";
    }

    function showAlert(elementId, message, type) {
        let el = document.getElementById(elementId);
        el.className = `alert alert-${type}`;
        el.innerText = message;
        if(type === 'success') {
            setTimeout(() => { el.innerText = ""; el.className = ""; }, 4000);
        }
    }
</script>

</body>
</html>
