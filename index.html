<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi QR Barcode</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-gray-100 font-sans antialiased">
    <div class="container mx-auto max-w-lg p-4 mt-6">
        <div class="bg-white rounded-lg shadow-md p-6">
            <h1 class="text-2xl font-bold text-center text-blue-600 mb-6">Absensi QR Barcode</h1>
            
            <!-- Pilih Sesi -->
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Pilih Sesi Absensi:</label>
                <select id="selectSesi" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
                    <option value="">Memuat Sesi...</option>
                </select>
            </div>

            <!-- ID / PIN Scanner -->
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">ID / NIP / PIN Scanner (Guru / Admin):</label>
                <input type="password" id="inputScanner" placeholder="Masukkan PIN / NIP / Kode Admin" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
                <p class="text-xs text-gray-500 mt-1">Wajib diisi sebelum melakukan scan barcode!</p>
            </div>

            <!-- Kontrol Tombol Buka/Tutup Kamera -->
            <div class="flex space-x-2 mb-4">
                <button type="button" onclick="bukaKamera()" class="flex-1 bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded transition duration-200">
                    Buka Kamera
                </button>
                <button type="button" onclick="tutupKamera()" class="flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded transition duration-200">
                    Tutup Kamera
                </button>
            </div>

            <!-- Kamera Scanner QR -->
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Kamera Scanner QR:</label>
                <div id="reader" class="w-full rounded overflow-hidden border bg-black" style="min-height: 250px;"></div>
            </div>

            <!-- Status Notifikasi -->
            <div id="notifikasi" class="hidden p-4 rounded text-center font-semibold mb-4"></div>
            
            <div class="text-center text-xs text-gray-400 mt-6">
                Sistem Absensi Dinamis Berbasis Google Apps Script
            </div>
        </div>
    </div>

    <script>
        let html5QrCode = null;
        let isProcessing = false;
        let isCameraRunning = false;

        window.onload = function() {
            if (typeof google === 'undefined' || !google.script) {
                document.getElementById('selectSesi').innerHTML = '<option value="Sesi 1">Sesi 1 (Mode Simulasi)</option>';
                showNotif("Berjalan dalam mode offline/preview.", "warning");
                return;
            }

            google.script.run
                .withSuccessHandler(function(data) {
                    let select = document.getElementById('selectSesi');
                    select.innerHTML = '';
                    if(data && data.sesi && data.sesi.length > 0) {
                        data.sesi.forEach(function(sesi) {
                            let opt = document.createElement('option');
                            opt.value = sesi.namaSesi;
                            opt.textContent = `${sesi.namaSesi} (${sesi.mulaiTW} - ${sesi.tutup})`;
                            select.appendChild(opt);
                        });
                    } else {
                        select.innerHTML = '<option value="">Pengaturan Sesi Kosong</option>';
                        showNotif("Sheet Pengaturan kosong. Harap isi data sesi di Google Sheets.", "error");
                    }
                })
                .withFailureHandler(function(err) {
                    let select = document.getElementById('selectSesi');
                    select.innerHTML = '<option value="">Gagal Memuat Sesi</option>';
                    showNotif("Error memuat database: " + err.message, "error");
                })
                .getDatabase();
        };

        function bukaKamera() {
            let scannerID = document.getElementById('inputScanner').value.trim();
            if (!scannerID) {
                showNotif("Mohon isi ID/PIN Scanner (Guru/Admin) terlebih dahulu sebelum membuka kamera!", "error");
                return;
            }

            if (isCameraRunning) {
                showNotif("Kamera sudah aktif.", "info");
                return;
            }

            try {
                if (!html5QrCode) {
                    html5QrCode = new Html5Qrcode("reader");
                }
                const config = { fps: 10, qrbox: { width: 250, height: 250 } };
                
                html5QrCode.start(
                    { facingMode: "environment" }, 
                    config, 
                    onScanSuccess,
                    onScanFailure
                ).then(() => {
                    isCameraRunning = true;
                    showNotif("Kamera berhasil diaktifkan. Silakan scan barcode.", "info");
                }).catch(err => {
                    console.error("Gagal membuka kamera:", err);
                    showNotif("Gagal membuka kamera. Pastikan izin kamera browser diaktifkan.", "error");
                });
            } catch (e) {
                console.error(e);
                showNotif("Terjadi kesalahan saat menginisialisasi kamera.", "error");
            }
        }

        function tutupKamera() {
            if (html5QrCode && isCameraRunning) {
                html5QrCode.stop().then(() => {
                    isCameraRunning = false;
                    showNotif("Kamera berhasil ditutup.", "info");
                }).catch(err => {
                    console.error("Gagal menghentikan kamera: ", err);
                });
            } else {
                showNotif("Kamera sedang tidak aktif.", "info");
            }
        }

        function onScanSuccess(decodedText, decodedResult) {
            // Validasi ketat sebelum mengirim data: Pastikan ID Scanner tidak kosong
            let scannerID = document.getElementById('inputScanner').value.trim();
            let selectedSesi = document.getElementById('selectSesi').value;

            if (!scannerID) {
                if (!isProcessing) {
                    isProcessing = true;
                    showNotif("GAGAL: Mohon isi ID / PIN Scanner (Guru/Admin) terlebih dahulu!", "error");
                    setTimeout(() => { isProcessing = false; }, 4000);
                }
                return; // Batalkan pengiriman ke sheet jika kosong
            }

            if (!selectedSesi) {
                if (!isProcessing) {
                    isProcessing = true;
                    showNotif("GAGAL: Pilih sesi absensi terlebih dahulu!", "error");
                    setTimeout(() => { isProcessing = false; }, 4000);
                }
                return;
            }

            if (isProcessing) return; // Mencegah spam scan ganda
            
            isProcessing = true;
            showNotif("Memproses QR Code: " + decodedText + "...", "info");

            if (typeof google === 'undefined' || !google.script) {
                setTimeout(() => {
                    showNotif("Simulasi Sukses Scan ID: " + decodedText, "success");
                    isProcessing = false;
                }, 1500);
                return;
            }

            // Kirim data ke backend Google Apps Script
            google.script.run
                .withSuccessHandler(function(response) {
                    if (response.status === "success") {
                        showNotif(response.message, "success");
                    } else if (response.status === "warning") {
                        showNotif(response.message, "warning");
                    } else {
                        showNotif(response.message, "error");
                    }
                    setTimeout(() => { isProcessing = false; }, 3000);
                })
                .withFailureHandler(function(error) {
                    showNotif("Terjadi kesalahan sistem: " + error.message, "error");
                    isProcessing = false;
                })
                .prosesAbsensi(scannerID, decodedText, selectedSesi);
        }

        function onScanFailure(error) {
            // Abaikan error per frame agar tidak memicu notifikasi berlebih
        }

        function showNotif(message, type) {
            let notif = document.getElementById('notifikasi');
            notif.classList.remove('hidden', 'bg-green-100', 'text-green-700', 'bg-red-100', 'text-red-700', 'bg-yellow-100', 'text-yellow-800', 'bg-blue-100', 'text-blue-700');
            
            if (type === "success") {
                notif.classList.add('bg-green-100', 'text-green-700');
            } else if (type === "error") {
                notif.classList.add('bg-red-100', 'text-red-700');
            } else if (type === "warning") {
                notif.classList.add('bg-yellow-100', 'text-yellow-800');
            } else {
                notif.classList.add('bg-blue-100', 'text-blue-700');
            }
            
            notif.innerText = message;
            notif.classList.remove('hidden');
        }
    </script>
</body>
</html>
