<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi Online</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .container { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        input, select, button { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 15px; }
        button { background: #007BFF; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #a71d2a; }
        .btn-success { background: #28a745; }
        .btn-success:hover { background: #218838; }
        .btn-warning { background: #ffc107; color: #000; }
        .btn-warning:hover { background: #e0a800; }
        .hidden { display: none !important; }
        #reader { width: 100%; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: #007BFF; color: white; }
        h4 { margin: 15px 0 5px 0; color: #333; }
        .camera-flex { display: flex; gap: 10px; margin-top: 10px; }
        .camera-flex button { flex: 1; }
        .admin-panel { background: #eef2f7; padding: 12px; border-radius: 6px; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Sistem Absensi Online</h2>

    <div id="login-section">
        <p>Masukkan NISN (Siswa), PIN (Guru), atau PIN (Admin):</p>
        <input type="text" id="credential" placeholder="Masukkan NISN / PIN" autocomplete="off">
        <button onclick="login()">Masuk</button>
    </div>

    <div id="dashboard-section" class="hidden">
        <h3 id="user-info"></h3>
        <p id="date-info"></p>

        <div id="session-container">
            <label>Pilih Sesi Absensi:</label>
            <select id="select-sesi" onchange="loadRealtimeData()"></select>
        </div>

        <!-- TOMBOL SCANNER GURU -->
        <div id="teacher-scanner-controls" class="hidden">
            <button id="btn-toggle-cam" onclick="toggleCamera('Siswa')">Buka Kamera Scanner Siswa</button>
        </div>

        <!-- TOMBOL SCANNER ADMIN -->
        <div id="admin-scanner-controls" class="hidden camera-flex">
            <button id="btn-cam-siswa" class="btn-success" onclick="switchCameraTarget('Siswa')">Buka Kamera Siswa</button>
            <button id="btn-cam-guru" class="btn-success" onclick="switchCameraTarget('Guru')">Buka Kamera Guru</button>
        </div>

        <div id="reader" class="hidden"></div>

        <!-- PANEL ADMIN KHUSUS PENGATURAN & IZIN -->
        <div id="admin-menu-section" class="hidden admin-panel">
            <h4>Panel Kontrol Admin</h4>
            <button class="btn-warning" onclick="toggleAdminModal('modal-sesi')">Pengaturan Sesi Dinamis</button>
            <button class="btn-warning" onclick="toggleAdminModal('modal-izin')">Input Izin / Sakit</button>
            <button class="btn-warning" onclick="toggleAdminModal('modal-libur')">Input Hari Libur</button>
        </div>

        <!-- MODAL / CONTAINER PENGATURAN SESI -->
        <div id="modal-sesi" class="hidden admin-panel">
            <h4>Kelola Sesi Absensi</h4>
            <div id="sesi-inputs-container"></div>
            <button onclick="addSessionRow()">+ Tambah Sesi</button>
            <button class="btn-success" onclick="saveSessionsToCloud()">Simpan Perubahan Sesi</button>
            <button class="btn-danger" onclick="toggleAdminModal('modal-sesi')">Tutup</button>
        </div>

        <!-- MODAL / CONTAINER IZIN SAKIT -->
        <div id="modal-izin" class="hidden admin-panel">
            <h4>Form Input Izin / Sakit</h4>
            <label>Pilih Peran:</label>
            <select id="permit-role" onchange="populatePermitNames()">
                <option value="Siswa">Siswa</option>
                <option value="Guru">Guru</option>
            </select>
            <label>Pilih Nama:</label>
            <select id="permit-name"></select>
            <label>Status:</label>
            <select id="permit-type">
                <option value="Izin">Izin (I)</option>
                <option value="Sakit">Sakit (S)</option>
            </select>
            <label>Keterangan:</label>
            <input type="text" id="permit-desc" placeholder="Alasan / Keterangan">
            <button class="btn-success" onclick="submitPermit()">Simpan Izin/Sakit</button>
            <button class="btn-danger" onclick="toggleAdminModal('modal-izin')">Tutup</button>
        </div>

        <!-- MODAL / CONTAINER HARI LIBUR -->
        <div id="modal-libur" class="hidden admin-panel">
            <h4>Form Input Hari Libur</h4>
            <label>Tanggal Libur:</label>
            <input type="date" id="holiday-date">
            <label>Keterangan Libur:</label>
            <input type="text" id="holiday-desc" placeholder="Misal: Libur Nasional">
            <button class="btn-success" onclick="submitHoliday()">Simpan Hari Libur</button>
            <button class="btn-danger" onclick="toggleAdminModal('modal-libur')">Tutup</button>
        </div>

        <!-- TABEL MONITORING REALTIME -->
        <div id="monitoring-section" class="hidden">
            <h4>Tabel Kehadiran Guru</h4>
            <div style="overflow-x:auto;">
                <table id="table-guru">
                    <thead>
                        <tr><th>No</th><th>Nama</th><th>Jam Scan</th><th>Sesi</th><th>Status</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <h4>Tabel Kehadiran Siswa</h4>
            <div style="overflow-x:auto;">
                <table id="table-siswa">
                    <thead>
                        <tr><th>No</th><th>Nama</th><th>Jam Scan</th><th>Sesi</th><th>Status</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <button class="btn-danger" style="margin-top: 20px;" onclick="logout()">Keluar</button>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxVTOloEUM-sXvJWaEGdJTBZDF3v2WsBSA_OcMx0U2uQTAK-Yh1opWi9oY04V_LbtTI/exec"; // <-- Ganti dengan URL Web App Anda
    let currentUser = null;
    let html5QrCode = null;
    let isCameraOpen = false;
    let activeScanTarget = "Siswa";
    let appConfig = null;
    let adminDataCache = null;
    let realtimeInterval = null;

    async function login() {
        const credential = document.getElementById("credential").value.trim();
        if (!credential) {
            Swal.fire("Peringatan", "Kredensial tidak boleh kosong!", "warning");
            return;
        }

        Swal.fire({ title: "Memeriksa...", allowOutsideClick: false, didOpen: () => Swal.showLoading() });

        try {
            let response = await fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({ action: "login", credential: credential })
            });
            let result = await response.json();
            Swal.close();

            if (result.status === "success") {
                currentUser = result;
                initDashboard();
            } else {
                Swal.fire("Gagal Masuk", result.message, "error");
            }
        } catch (err) {
            Swal.close();
            Swal.fire("Error", "Gagal terhubung ke server.", "error");
        }
    }

    async function initDashboard() {
        document.getElementById("login-section").classList.add("hidden");
        document.getElementById("dashboard-section").classList.remove("hidden");
        document.getElementById("user-info").innerText = `Halo, ${currentUser.name} (${currentUser.role})`;

        // Sembunyikan elemen admin secara mutlak saat awal inisialisasi
        document.getElementById("admin-scanner-controls").classList.add("hidden");
        document.getElementById("admin-menu-section").classList.add("hidden");
        document.getElementById("monitoring-section").classList.add("hidden");
        document.getElementById("teacher-scanner-controls").classList.add("hidden");

        Swal.fire({ title: "Memuat Konfigurasi...", allowOutsideClick: false, didOpen: () => Swal.showLoading() });

        try {
            let response = await fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({ action: "get_config" })
            });
            let result = await response.json();
            Swal.close();

            if (result.status === "libur") {
                Swal.fire("Hari Libur", result.message, "info").then(() => logout());
                return;
            }

            if (result.status === "success") {
                appConfig = result;
                document.getElementById("date-info").innerText = `Tanggal: ${appConfig.date}`;
                
                let selectSesi = document.getElementById("select-sesi");
                selectSesi.innerHTML = "";
                appConfig.sessions.forEach(s => {
                    let opt = document.createElement("option");
                    opt.value = s.namaSesi;
                    opt.text = `${s.namaSesi} (Mulai: ${s.mulaiTW} - Tutup: ${s.tutupSesi})`;
                    selectSesi.appendChild(opt);
                });

                if (currentUser.role === "Guru") {
                    document.getElementById("teacher-scanner-controls").classList.remove("hidden");
                } else if (currentUser.role === "Admin") {
                    document.getElementById("admin-scanner-controls").classList.remove("hidden");
                    document.getElementById("admin-menu-section").classList.remove("hidden");
                    document.getElementById("monitoring-section").classList.remove("hidden");
                    loadAdminDataCache();
                    loadRealtimeData();
                    realtimeInterval = setInterval(loadRealtimeData, 10000);
                }
            }
        } catch (err) {
            Swal.close();
            console.error(err);
        }
    }

    async function switchCameraTarget(targetType) {
        if (isCameraOpen) {
            await stopCamera();
            if (activeScanTarget !== targetType) {
                activeScanTarget = targetType;
                startCamera();
            } else {
                activeScanTarget = targetType;
            }
        } else {
            activeScanTarget = targetType;
            startCamera();
        }
    }

    function toggleCamera(targetType) {
        activeScanTarget = targetType;
        if (!isCameraOpen) {
            startCamera();
        } else {
            stopCamera();
        }
    }

    function startCamera() {
        const readerDiv = document.getElementById("reader");
        readerDiv.classList.remove("hidden");
        
        if (currentUser.role === "Guru") {
            document.getElementById("btn-toggle-cam").innerText = "Tutup Kamera Scanner Siswa";
            document.getElementById("btn-toggle-cam").className = "btn-danger";
        } else if (currentUser.role === "Admin") {
            if (activeScanTarget === "Siswa") {
                document.getElementById("btn-cam-siswa").innerText = "Tutup Kamera Siswa";
                document.getElementById("btn-cam-siswa").className = "btn-danger";
                document.getElementById("btn-cam-guru").innerText = "Buka Kamera Guru";
                document.getElementById("btn-cam-guru").className = "btn-success";
            } else {
                document.getElementById("btn-cam-guru").innerText = "Tutup Kamera Guru";
                document.getElementById("btn-cam-guru").className = "btn-danger";
                document.getElementById("btn-cam-siswa").innerText = "Buka Kamera Siswa";
                document.getElementById("btn-cam-siswa").className = "btn-success";
            }
        }
        
        isCameraOpen = true;

        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: 250 },
            onScanSuccess
        ).catch(err => {
            Swal.fire("Gagal Kamera", "Tidak dapat mengakses kamera perangkat: " + err, "error");
            stopCamera();
        });
    }

    async function stopCamera() {
        if (html5QrCode && isCameraOpen) {
            try {
                await html5QrCode.stop();
                html5QrCode.clear();
            } catch(e) {}
        }
        cleanupCameraUI();
    }

    function cleanupCameraUI() {
        document.getElementById("reader").classList.add("hidden");
        if (currentUser.role === "Guru") {
            document.getElementById("btn-toggle-cam").innerText = "Buka Kamera Scanner Siswa";
            document.getElementById("btn-toggle-cam").className = "";
        } else if (currentUser.role === "Admin") {
            document.getElementById("btn-cam-siswa").innerText = "Buka Kamera Siswa";
            document.getElementById("btn-cam-siswa").className = "btn-success";
            document.getElementById("btn-cam-guru").innerText = "Buka Kamera Guru";
            document.getElementById("btn-cam-guru").className = "btn-success";
        }
        isCameraOpen = false;
    }

    async function onScanSuccess(decodedText) {
        if (html5QrCode && isCameraOpen) {
            await html5QrCode.pause();
        }

        let selectedSesi = document.getElementById("select-sesi").value;
        let payload = {
            action: "scan",
            scannerRole: currentUser.role,
            scannerId: currentUser.id,
            scannedCode: decodedText.trim(),
            sesi: selectedSesi,
            tanggal: appConfig.date,
            scanTargetType: activeScanTarget
        };

        try {
            let response = await fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            });
            let result = await response.json();

            if (result.status === "success") {
                Swal.fire({ icon: 'success', title: 'Berhasil', text: result.message, timer: 2000, showConfirmButton: false });
                if (currentUser.role === "Admin") loadRealtimeData();
            } else {
                Swal.fire("Perhatian", result.message, "warning");
            }
        } catch (err) {
            Swal.fire("Error", "Gagal mengirim data absen ke server.", "error");
        }

        setTimeout(async () => {
            if (html5QrCode && isCameraOpen) {
                await html5QrCode.resume();
            }
        }, 2500);
    }

    async function loadRealtimeData() {
        let selectedSesi = document.getElementById("select-sesi").value;
        try {
            let response = await fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({ action: "get_realtime_data", sesi: selectedSesi, tanggal: appConfig.date })
            });
            let res = await response.json();
            if (res.status === "success") {
                populateTable("table-guru", res.guruData);
                populateTable("table-siswa", res.siswaData);
            }
        } catch (e) {}
    }

    function populateTable(tableId, data) {
        let tbody = document.querySelector(`#${tableId} tbody`);
        tbody.innerHTML = "";
        if (data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="color: #777;">Belum ada data absensi</td></tr>`;
            return;
        }
        data.forEach((row, index) => {
            let tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${index + 1}</td>
                <td>${row.nama}</td>
                <td>${row.jam}</td>
                <td>${row.sesi}</td>
                <td><b>${row.status}</b></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function toggleAdminModal(modalId) {
        let el = document.getElementById(modalId);
        if (el.classList.contains("hidden")) {
            el.classList.remove("hidden");
            if (modalId === 'modal-sesi') renderSessionInputs();
        } else {
            el.classList.add("hidden");
        }
    }

    async function loadAdminDataCache() {
        try {
            let res = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "get_admin_data" }) });
            let data = await res.json();
            if (data.status === "success") {
                adminDataCache = data;
                populatePermitNames();
            }
        } catch(e) {}
    }

    function renderSessionInputs() {
        let container = document.getElementById("sesi-inputs-container");
        container.innerHTML = "";
        if (!appConfig || !appConfig.sessions) return;

        appConfig.sessions.forEach((s) => {
            let div = document.createElement("div");
            div.style.cssText = "border: 1px solid #ccc; padding: 8px; margin-bottom: 8px; border-radius: 4px;";
            div.innerHTML = `
                <label>Nama Sesi:</label><input type="text" class="inp-sesi-name" value="${s.namaSesi}">
                <label>Mulai TW:</label><input type="time" class="inp-mulai" value="${s.mulaiTW}">
                <label>Batas TW/TL:</label><input type="time" class="inp-batas" value="${s.batasTWTL}">
                <label>Tutup Sesi:</label><input type="time" class="inp-tutup" value="${s.tutupSesi}">
                <button class="btn-danger" style="margin-top:5px;" onclick="this.parentElement.remove()">Hapus Sesi Ini</button>
            `;
            container.appendChild(div);
        });
    }

    function addSessionRow() {
        let container = document.getElementById("sesi-inputs-container");
        let div = document.createElement("div");
        div.style.cssText = "border: 1px solid #ccc; padding: 8px; margin-bottom: 8px; border-radius: 4px;";
        div.innerHTML = `
            <label>Nama Sesi:</label><input type="text" class="inp-sesi-name" placeholder="Sesi Baru">
            <label>Mulai TW:</label><input type="time" class="inp-mulai" value="07:00">
            <label>Batas TW/TL:</label><input type="time" class="inp-batas" value="07:15">
            <label>Tutup Sesi:</label><input type="time" class="inp-tutup" value="09:00">
            <button class="btn-danger" style="margin-top:5px;" onclick="this.parentElement.remove()">Hapus Sesi Ini</button>
        `;
        container.appendChild(div);
    }

    async function saveSessionsToCloud() {
        let names = document.querySelectorAll(".inp-sesi-name");
        let mulais = document.querySelectorAll(".inp-mulai");
        let batass = document.querySelectorAll(".inp-batas");
        let tutups = document.querySelectorAll(".inp-tutup");
        
        let newSessions = [];
        for(let i=0; i<names.length; i++) {
            newSessions.push({
                namaSesi: names[i].value,
                mulaiTW: mulais[i].value,
                batasTWTL: batass[i].value,
                tutupSesi: tutups[i].value
            });
        }

        Swal.fire({ title: "Menyimpan Sesi...", allowOutsideClick: false, didOpen: () => Swal.showLoading() });

        try {
            let res = await fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({ action: "save_session", sessions: newSessions })
            });
            let result = await res.json();
            
            // Perbarui data sesi secara lokal tanpa melakukan reload halaman
            appConfig.sessions = newSessions;
            let selectSesi = document.getElementById("select-sesi");
            let currentSelected = selectSesi.value;
            selectSesi.innerHTML = "";
            appConfig.sessions.forEach(s => {
                let opt = document.createElement("option");
                opt.value = s.namaSesi;
                opt.text = `${s.namaSesi} (Mulai: ${s.mulaiTW} - Tutup: ${s.tutupSesi})`;
                selectSesi.appendChild(opt);
            });
            selectSesi.value = currentSelected;

            toggleAdminModal('modal-sesi');
            Swal.fire("Sukses", result.message, "success");
        } catch(err) {
            Swal.fire("Error", "Gagal menyimpan perubahan sesi.", "error");
        }
    }

    function populatePermitNames() {
        if (!adminDataCache) return;
        let role = document.getElementById("permit-role").value;
        let selectName = document.getElementById("permit-name");
        selectName.innerHTML = "";
        let list = (role === "Siswa") ? adminDataCache.siswaList : adminDataCache.guruList;
        
        list.forEach(item => {
            let opt = document.createElement("option");
            opt.value = item.id;
            opt.text = `${item.name} (${item.id})`;
            selectName.appendChild(opt);
        });
    }

    async function submitPermit() {
        let role = document.getElementById("permit-role").value;
        let selectName = document.getElementById("permit-name");
        let id = selectName.value;
        let name = selectName.options[selectName.selectedIndex].text.split(" (")[0];
        let type = document.getElementById("permit-type").value;
        let desc = document.getElementById("permit-desc").value;

        Swal.fire({ title: "Menyimpan Izin/Sakit...", allowOutsideClick: false, didOpen: () => Swal.showLoading() });

        let res = await fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify({ action: "save_permit", role, id, name, type, desc, date: appConfig.date })
        });
        let result = await res.json();
        Swal.fire("Sukses", result.message, "success");
        toggleAdminModal('modal-izin');
        loadRealtimeData();
    }

    async function submitHoliday() {
        let date = document.getElementById("holiday-date").value;
        let desc = document.getElementById("holiday-desc").value;
        if(!date || !desc) { Swal.fire("Peringatan", "Lengkapi tanggal dan keterangan libur!", "warning"); return; }

        Swal.fire({ title: "Menyimpan Hari Libur...", allowOutsideClick: false, didOpen: () => Swal.showLoading() });

        let res = await fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify({ action: "save_holiday", date, desc })
        });
        let result = await res.json();
        Swal.fire("Sukses", result.message, "success");
        toggleAdminModal('modal-libur');
    }

    function logout() {
        if (isCameraOpen) stopCamera();
        if (realtimeInterval) clearInterval(realtimeInterval);
        currentUser = null;
        document.getElementById("credential").value = "";
        document.getElementById("dashboard-section").classList.add("hidden");
        document.getElementById("login-section").classList.remove("hidden");
    }
</script>

</body>
</html>
